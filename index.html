<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Rombo — motore virtuale</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="cluster">
    <canvas id="gauge" width="900" height="900" aria-label="Contagiri"></canvas>
    <div id="status"><span id="srcStatus">Simulazione</span> · <span id="warmStatus">motore freddo</span></div>
  </section>

  <section id="controls">
    <header><h1>ROMBO</h1><span class="sub">motore virtuale</span></header>

    <button id="startBtn" class="big primary">AVVIA MOTORE</button>

    <div class="group">
      <label>Motore</label>
      <div class="seg" id="presetSeg"></div>
    </div>

    <div class="group">
      <label>Cambio</label>
      <div class="seg" id="modeSeg">
        <button data-v="comfort">Comfort</button>
        <button data-v="dynamic">Dynamic</button>
        <button data-v="manual">Manuale</button>
      </div>
    </div>

    <div class="row">
      <button id="valveBtn" class="toggle">Valvola scarico: <b>CHIUSA</b></button>
      <div class="vol"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="1" step="0.01"></div>
    </div>
    <div class="row tone">
      <div class="vol"><label for="width">Ampiezza stereo <span id="widthVal"></span></label><input id="width" type="range" min="0" max="1" step="0.05"></div>
      <div class="vol"><label for="bass">Tono · bassi <span id="bassVal"></span></label><input id="bass" type="range" min="-6" max="6" step="1"></div>
      <div class="vol"><label for="treble">Tono · alti <span id="trebleVal"></span></label><input id="treble" type="range" min="-6" max="6" step="1"></div>
    </div>

    <div class="group">
      <label>Sorgente velocità</label>
      <div class="seg" id="srcSeg">
        <button data-v="gps">GPS (guida)</button>
        <button data-v="sim">Simulazione</button>
      </div>
    </div>

    <div id="shiftRow" class="row">
      <button id="downBtn" class="big">MARCIA −</button>
      <button id="upBtn" class="big accent">MARCIA +</button>
    </div>

    <div id="simPanel" class="group">
      <div class="row">
        <button id="gasBtn" class="big hold accent">GAS</button>
        <button id="brakeBtn" class="big hold">FRENO</button>
        <button id="neutralBtn" class="toggle">Folle: <b>NO</b></button>
      </div>
      <div class="vol"><label for="thr">Pedale <span id="thrVal">100%</span></label><input id="thr" type="range" min="0.1" max="1" step="0.05"></div>
    </div>

    <details id="more">
      <summary>Altre impostazioni</summary>
      <div class="vol"><label for="sens">Sensibilità GPS (carico) <span id="sensVal"></span></label><input id="sens" type="range" min="0.3" max="3" step="0.1"></div>
      <label class="chk"><input type="checkbox" id="hybridChk"> Strato campioni reali CC0 (sperimentale, solo 4T, fino a ~3000 giri)</label>
      <label class="chk"><input type="checkbox" id="mediaChk"> Comandi volante (Media Session)</label>
      <label class="chk"><input type="checkbox" id="routeChk"> Instrada l'audio come sorgente media (prova se l'auto non riproduce)</label>
      <p class="hint">Tasti: ↑ / Invio / Traccia succ. / Play = marcia su · ↓ / Traccia prec. = marcia giù · W = gas · S = freno (simulazione).
      In GPS il suono segue velocità e accelerazione dell'auto; serve HTTPS e il permesso posizione.</p>
    </details>
  </section>
</main>
<audio id="mediaEl" playsinline></audio>
<script type="module" src="app.js"></script>
</body>
</html>
